name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "src/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate frontend deployment configuration
        shell: bash
        env:
          NEXT_PUBLIC_GAME_WS_URL: ${{ vars.CLOUD_RUN_GAME_SERVICE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_GAME_WS_URL" ]; then
            echo "Missing required repository variable: CLOUD_RUN_GAME_SERVICE_URL"
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_GAME_WS_URL" != https://* ]]; then
            echo "CLOUD_RUN_GAME_SERVICE_URL must start with https://"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing required repository variable: NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" != https://* ]]; then
            echo "NEXT_PUBLIC_SUPABASE_URL must start with https://"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Missing required repository variable: NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build static frontend
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_GAME_WS_URL: ${{ vars.CLOUD_RUN_GAME_SERVICE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
