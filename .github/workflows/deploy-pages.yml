name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "src/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Resolve active game service URL
        id: game-service
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
        run: |
          for name in GCP_PROJECT_ID GCP_REGION GCP_CLOUD_RUN_SERVICE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository variable: $name"
              exit 1
            fi
          done

          GAME_SERVICE_URL=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')
          if [[ "$GAME_SERVICE_URL" != https://* ]]; then
            echo "Cloud Run returned an invalid game service URL."
            exit 1
          fi
          echo "url=$GAME_SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build static frontend
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_GAME_WS_URL: ${{ steps.game-service.outputs.url }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
