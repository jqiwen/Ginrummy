name: CI

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - "src/game-service/**"
      - "supabase/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
    paths:
      - "src/frontend/**"
      - "src/game-service/**"
      - "supabase/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, build, and container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/game-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/game-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build --tag ginrummy-game-service:ci .

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --runInBand

      - name: Build static frontend
        env:
          NEXT_PUBLIC_GAME_WS_URL: https://example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
